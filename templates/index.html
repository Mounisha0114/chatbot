<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishnu Institute Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-header { backdrop-filter: blur(12px); background-color: rgba(255, 255, 255, 0.8); }
        .bot-bubble { border-top-left-radius: 2px; }
        .user-bubble { border-top-right-radius: 2px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="flex-none border-b border-gray-100 glass-header sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-blue-900 flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-blue-900 leading-tight">Vishnu Institute</h1>
                    <div class="flex items-center gap-1.5">
                        <span class="relative flex h-2 w-2">
                            <span id="status-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 bg-red-400"></span>
                            <span id="status-dot" class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                        </span>
                        <p id="status-text" class="text-xs text-slate-500 font-medium tracking-wide uppercase">Key Required</p>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleSettings(true)" class="p-2 text-slate-400 hover:text-blue-900 hover:bg-slate-100 rounded-full transition-colors">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Settings Modal -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/30 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all scale-100">
            <div class="flex justify-between items-center p-4 border-b border-slate-100 bg-slate-50">
                <h3 class="font-semibold text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i> Configuration
                </h3>
                <button onclick="toggleSettings(false)" class="text-slate-400 hover:text-red-500 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-key text-blue-600"></i> Google Gemini API Key
                    </label>
                    <input type="password" id="api-key-input" placeholder="Paste AI Studio Key here..." 
                        class="w-full p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-mono text-sm">
                    <p class="text-xs text-slate-400">
                        Get a key from <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-blue-600 hover:underline">Google AI Studio</a>.
                    </p>
                </div>
                <button onclick="saveApiKey()" class="w-full py-3 rounded-xl text-white font-medium bg-blue-900 hover:bg-blue-800 transition-colors shadow-lg">
                    Save Configuration
                </button>
            </div>
        </div>
    </div>

    <!-- Main Chat Area -->
    <main class="flex-1 overflow-y-auto bg-slate-50/50">
        <div id="chat-container" class="max-w-3xl mx-auto px-6 py-8 flex flex-col gap-6">
            <div class="flex gap-4 justify-start">
                <div class="w-8 h-8 rounded-full bg-blue-900 flex-shrink-0 flex items-center justify-center text-white mt-1 shadow-sm">
                    <i class="fa-solid fa-robot text-xs"></i>
                </div>
                <div class="max-w-[85%] p-4 rounded-2xl text-sm leading-relaxed shadow-sm bg-blue-50 text-slate-700 border border-blue-100 bot-bubble">
                    Namaste! I am the AI assistant for Vishnu Institute of Technology. How can I assist you with your academic journey today?
                </div>
            </div>
        </div>
        <div id="scroll-anchor"></div>
    </main>

    <!-- Footer Input -->
    <footer class="flex-none bg-white p-6 pt-2 border-t border-slate-100">
        <div class="max-w-3xl mx-auto space-y-4">
            <div id="quick-replies" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-2">
                <button onclick="sendQuickReply('What courses are offered?')" class="text-left text-sm px-4 py-3 bg-white border border-slate-200 rounded-xl hover:border-blue-300 hover:shadow-md hover:text-blue-900 transition-all flex items-center justify-between group">
                    <span>What courses are offered?</span>
                    <i class="fa-solid fa-arrow-right opacity-0 group-hover:opacity-100 text-blue-600 transition-all"></i>
                </button>
                <button onclick="sendQuickReply('Tell me about placements')" class="text-left text-sm px-4 py-3 bg-white border border-slate-200 rounded-xl hover:border-blue-300 hover:shadow-md hover:text-blue-900 transition-all flex items-center justify-between group">
                    <span>Tell me about placements</span>
                    <i class="fa-solid fa-arrow-right opacity-0 group-hover:opacity-100 text-blue-600 transition-all"></i>
                </button>
            </div>

            <div class="relative flex items-center gap-2 bg-white rounded-2xl shadow-lg shadow-slate-200/50 border border-slate-100 p-2">
                <input type="text" id="user-input" autocomplete="off" placeholder="Ask about admissions, placements..." 
                    class="flex-1 bg-transparent px-4 py-3 outline-none text-slate-700 placeholder:text-slate-400 text-sm md:text-base">
                <button id="send-btn" onclick="handleSend()" class="p-3 bg-blue-900 text-white rounded-xl hover:bg-blue-800 shadow-md transition-all flex items-center justify-center disabled:bg-slate-100 disabled:text-slate-300">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
            <p class="text-center text-[10px] text-slate-400 uppercase tracking-widest">Powered by VITB AI | Gemini 2.5</p>
        </div>
    </footer>

    <script>
        const DEFAULT_API_KEY = "{{ api_key }}";
        const COLLEGE_CONTEXT = "You are an official AI assistant for Vishnu Institute of Technology, Bhimavaram. College info: Name: Vishnu Institute of Technology (VITB). Location: Bhimavaram, Andhra Pradesh. Courses: B.Tech, M.Tech. Focus: Engineering, innovation, placements, discipline. Answer clearly and politely.";
        
        // Target model
        const PRIMARY_MODEL = "gemini-2.5-flash";
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const modal = document.getElementById('settings-modal');
        const keyInput = document.getElementById('api-key-input');
        
        let isTyping = false;

        window.onload = () => {
            const saved = localStorage.getItem('vitb_gemini_key');
            if (saved) {
                keyInput.value = saved;
                updateStatus(true);
            } else if (DEFAULT_API_KEY) {
                updateStatus(true);
            }
        };

        function updateStatus(isOnline) {
            const ping = document.getElementById('status-ping');
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            
            if (isOnline) {
                ping.className = "animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 bg-green-400";
                dot.className = "relative inline-flex rounded-full h-2 w-2 bg-green-500";
                text.innerText = "AI Online";
                text.classList.replace('text-slate-500', 'text-green-600');
            }
        }

        function toggleSettings(show) {
            modal.classList.toggle('hidden', !show);
        }

        function saveApiKey() {
            const val = keyInput.value.trim();
            if (val) {
                localStorage.setItem('vitb_gemini_key', val);
                updateStatus(true);
                addMessage("system", "API Key updated successfully.");
                toggleSettings(false);
            }
        }

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `flex gap-4 ${role === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in`;
            
            const isBot = role === 'model';
            const isSystem = role === 'system';

            div.innerHTML = `
                ${!isBot && !isSystem ? '' : `
                    <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center text-white mt-1 shadow-sm ${isSystem ? 'bg-amber-500' : 'bg-blue-900'}">
                        <i class="fa-solid ${isSystem ? 'fa-circle-exclamation' : 'fa-robot'} text-xs"></i>
                    </div>
                `}
                <div class="max-w-[85%] p-4 rounded-2xl text-sm leading-relaxed shadow-sm ${
                    role === 'user' 
                    ? 'bg-blue-900 text-white user-bubble' 
                    : isSystem 
                        ? 'bg-amber-50 text-amber-800 border border-amber-100' 
                        : 'bg-blue-50 text-slate-700 border border-blue-100 bot-bubble'
                }">
                    ${text}
                </div>
                ${role !== 'user' ? '' : `
                    <div class="w-8 h-8 rounded-full bg-slate-200 flex-shrink-0 flex items-center justify-center text-slate-500 mt-1">
                        <i class="fa-solid fa-user text-xs"></i>
                    </div>
                `}
            `;
            chatContainer.appendChild(div);
            div.scrollIntoView({ behavior: 'smooth' });
        }

        async function fetchWithRetry(model, apiKey, text, retries = 5) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(
                        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ 
                                    role: "user", 
                                    parts: [{ text: COLLEGE_CONTEXT + "\n\nUser Question: " + text }] 
                                }],
                                generationConfig: { temperature: 0.2, maxOutputTokens: 500 }
                            })
                        }
                    );

                    if (response.status === 429) {
                        const delay = Math.pow(2, i) * 1000;
                        await new Promise(r => setTimeout(r, delay));
                        continue;
                    }

                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(errData.error?.message || "API Error");
                    }

                    return await response.json();
                } catch (err) {
                    if (i === retries - 1) throw err;
                }
            }
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text || isTyping) return;

            const apiKey = localStorage.getItem('vitb_gemini_key') || DEFAULT_API_KEY;
            if (!apiKey) {
                addMessage("system", "⚠️ API Key missing. Open settings to add one.");
                return;
            }

            addMessage("user", text);
            userInput.value = "";
            setLoading(true);

            try {
                let data;
                try {
                    // Attempt with Gemini 2.5 Flash
                    data = await fetchWithRetry(PRIMARY_MODEL, apiKey, text);
                } catch (e) {
                    console.log("Primary model failed, attempting fallback to 1.5...");
                    // Fallback to Gemini 1.5 Flash
                    data = await fetchWithRetry(FALLBACK_MODEL, apiKey, text);
                }

                const botText = data.candidates?.[0]?.content?.parts?.[0]?.text || "I'm having trouble processing that right now.";
                addMessage("model", botText);
            } catch (err) {
                console.error(err);
                addMessage("system", "Error: " + err.message + ". Check your API key or network connection.");
            } finally {
                setLoading(false);
                const quickReplies = document.getElementById('quick-replies');
                if (quickReplies) quickReplies.classList.add('hidden');
            }
        }

        function setLoading(loading) {
            isTyping = loading;
            sendBtn.disabled = loading;
            sendBtn.innerHTML = loading ? '<i class="fa-solid fa-spinner animate-spin"></i>' : '<i class="fa-solid fa-paper-plane"></i>';
        }

        function sendQuickReply(text) {
            userInput.value = text;
            handleSend();
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
